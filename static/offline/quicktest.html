<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Быстрый тест — VetGuardian офлайн</title>
  <link rel="manifest" href="/offline/manifest.json">
  <link rel="apple-touch-icon" href="/offline/icon-192.png">
  <link rel="stylesheet" href="/offline/styles.css">
</head>
<body data-page="quicktest">
  <header class="offline-topbar">
    <a href="index.html">← На главную</a>
  </header>

  <p id="offline-blocked-msg" class="offline-alert offline-alert--error" hidden>
    Офлайн-режим не активирован. Пожалуйста, подключитесь к интернету один раз и нажмите «Да, сохранить».
  </p>
  <p id="install-status-ok" class="offline-alert offline-alert--ok" hidden></p>
  <p id="install-status-err" class="offline-alert offline-alert--error" hidden></p>

  <main class="offline-main" id="qt-root">
    <p class="qt-progress" id="qt-progress"></p>
    <p class="qt-question" id="qt-question"></p>
    <div class="qt-options" id="qt-options"></div>

    <div class="qt-result" id="qt-result">
      <span class="level-badge" id="qt-level-badge"></span>
      <div id="qt-result-text"></div>
      <div class="qt-actions">
        <a class="btn btn-primary btn-link" id="qt-handbook-link" href="handbook.html">Подробнее в справочнике</a>
        <a class="btn btn-secondary btn-link" href="index.html">На главную офлайн</a>
      </div>
    </div>
  </main>

  <div id="install-banner" class="install-banner" hidden>
    <p>
      Чтобы пользоваться VetGuardian без интернета (в поездках, на даче), сохраните офлайн-справочник.
      Это займёт около 2 МБ памяти. Разрешить?
    </p>
    <div class="install-banner__actions">
      <button type="button" class="btn btn-primary" id="install-btn-yes">Да, сохранить</button>
      <button type="button" class="btn btn-secondary" id="install-btn-no">Не сейчас</button>
    </div>
  </div>

  <script src="/offline/script.js" defer></script>
</body>
</html>
